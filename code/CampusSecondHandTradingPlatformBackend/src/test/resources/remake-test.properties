spring.profiles.active=dev
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:dev/schema.sql
spring.sql.init.data-locations=classpath:dev/data.sql
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:com/cuzssp/campussecondhandtradingplatformbackend/mapper/*.xml
mybatis-plus.global-config.db-config.id-type=auto
cors.allow-origins=*
jwt.secret=context-test-key
jwt.expiration=86400
chat.secret=context-chat-key
s3.config.storage-support=r2
s3.config.account-id=test
s3.config.access-key=test
s3.config.secret-key=test
s3.config.endpoint=https://example.test
s3.config.bucket-name=test
s3.config.child-folder=test
s3.config.cdn-domain=https://example.test
s3.config.region=auto
