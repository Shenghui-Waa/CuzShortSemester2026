# ===================================================
# 校园二手交易平台 - 应用配置 - 开发
# 所有敏感值通过环境变量注入
# ===================================================

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${db.url}
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  sql:
    init:
      schema-locations: classpath:dev/schema.sql
      data-locations: classpath:dev/data.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
